# The aes crate uses a portable implementation on ARM unless this cfg is set.
# Apple Silicon has ARMv8 AES instructions; without the cfg every clip is
# decrypted in software.
[target.aarch64-apple-darwin]
rustflags = ["--cfg", "aes_armv8"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["--cfg", "aes_armv8"]

[target.aarch64-unknown-linux-musl]
rustflags = ["--cfg", "aes_armv8"]
