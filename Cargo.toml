[package]
name = "tesdec"
version = "0.1.0"
edition = "2021"
description = "Decrypt TeslaCam clips locally with a Tesla account"
license = "MIT"
readme = "README.md"

[lib]
name = "tesdec"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = ["webview"]
# Sign-in window that captures the Tesla redirect before the dashcam site can use the code.
webview = ["dep:tao", "dep:wry"]

[dependencies]
aes = "0.9"
anyhow = "1"
base64 = "0.23"
cbc = "0.2"
cipher = { version = "0.5", features = ["block-padding"] }
clap = { version = "4", features = ["derive"] }
getrandom = "0.4"
libc = "0.2"
md-5 = "0.11"
open = "5"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
url = "2"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
tao = { version = "0.37", optional = true }
wry = { version = "0.57", optional = true }

# `cargo run` is the usual command. Debug builds of the AES loop are many
# times slower than an optimized one, so keep this profile optimized.
[profile.dev]
opt-level = 3

[profile.release]
lto = "thin"
